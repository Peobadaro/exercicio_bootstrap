<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h1 class="text-center text-white mb-4">Login</h1>
            <p class="text-center text-white mb-4">Please enter your Login and your Password</p>
            
            <form>
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0">
                            <i class="bi bi-person-fill text-white"></i>
                        </span>
                        <input type="text" class="form-control custom-input" placeholder="Username or Email">
                    </div>
                </div>
                
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0">
                            <i class="bi bi-lock-fill text-white"></i>
                        </span>
                        <input type="password" class="form-control custom-input" placeholder="Password">
                    </div>
                </div>
                
                <div class="text-end mb-3">
                    <a href="#" class="text-white-50 text-decoration-none small">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-outline-light w-100 mb-3">Login</button>
                
                <button type="button" class="btn btn-dark w-100 mb-3">
                    <img src="google-logo.png" alt="Google" class="google-icon">
                    Or, sign-in with Google
                </button>
                
                <div class="text-center text-white-50">
                    Not a member yet? <a href="#" class="text-success text-decoration-none">Register!</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
