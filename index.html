<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid d-flex justify-content-center align-items-center vh-100">
        <div class="form-container">
            <h2 class="text-center">Registo</h2>
            <p class="text-center">Por favor insira seus dados para cadastro.</p>

            <form>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" class="form-control input-custom" id="nome" placeholder="Digite seu nome" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control input-custom" id="email" placeholder="Digite seu e-mail" required>
                </div>
                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="tel" class="form-control input-custom" id="telefone" placeholder="Digite seu telefone" required>
                </div>
                <button type="submit" class="btn btn-custom w-100">Login</button>

                <div class="text-center mt-3">
                    <button class="btn btn-google w-100">
                        <img src="Imagem/Google-logo.png" alt="Google Logo" class="google-icon">
                        Or, sign-in with Google
                    </button>
                </div>

                <p class="text-center mt-3">Not a member yet? <a href="#" class="register-link">Register!</a></p>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
