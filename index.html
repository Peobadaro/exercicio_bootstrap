<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="form-container p-4 shadow">
            <h2 class="text-center mb-4">CADASTRO</h2>
            <p class="text-center text-muted mb-4">Preencha os dados abaixo para se cadastrar</p>

            <form>
                <div class="mb-3">
                    <label for="nome" class="form-label fw-bold">Nome Completo</label>
                    <div class="row">
                        <div class="col">
                            <input type="text" class="form-control" id="nome" placeholder="Primeiro nome" required>
                        </div>
                        <div class="col">
                            <input type="text" class="form-control" id="sobrenome" placeholder="Sobrenome" required>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label fw-bold">Telefone</label>
                    <input type="tel" class="form-control" id="telefone" placeholder="Digite seu telefone" required>
                </div>

                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" id="termos" required>
                    <label class="form-check-label" for="termos">Li e concordo com os termos do site</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">CADASTRAR</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
